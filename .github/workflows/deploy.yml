name: Deploy Static Website to GitHub Pages

on:
  push:
    branches: ["main"] # Triggers deployment when you push to your main branch

  # Allows you to trigger this workflow manually from the GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow native deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to prevent race conditions
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up GitHub Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # Automatically caches node_modules to speed up subsequent runs

      - name: Install Dependencies
        run: npm ci # Performs a clean, deterministic install from package-lock.json

      - name: Validate TypeScript and Vue Templates
        run: npx vue-tsc --noEmit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Integration Tests
        run: npx playwright test

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # Vite outputs production builds here

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
